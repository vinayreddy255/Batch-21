<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body></body>
  <script>
    // slice() - returns a shallow copy of a portion of an array into a new array object selected from start to end (end not included) where start and end represent the index of items in that array. The original array will not be modified.
    var arr1 = [1, 2, 3, 4, 5];
    var slicedArr = arr1.slice(1, 3); // [2, 3]
    console.log("Sliced array:", slicedArr);
    console.log("Original array:", arr1); // [1, 2, 3, 4, 5]
    // splice() - changes the contents of an array by removing or replacing existing elements and/or adding new elements in place. This method modifies the original array and returns an array containing the deleted elements.
    var arr2 = [1, 2, 3, 4, 5];
    // Remove elements
    var removedElements = arr2.splice(1, 2, "A", "B"); // [2, 3]
    console.log("Removed elements:", removedElements);
    console.log("Original array, after removal:", arr2); // [1, 4, 5]
  </script>
</html>
