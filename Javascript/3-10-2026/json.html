  <script>
    const obj = {
      name: "John",
      age: 30,
      city: "New York",
    };
    const str = "hello";

    console.log(strobj); // {"name":"John","age":30,"city":"New York"}
    console.log(parsedObj); // John
    console.log(typeof strobj); // string

  </script>
