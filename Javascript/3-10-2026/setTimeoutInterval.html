<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body></body>
  <script>
    const x = 10;
    setTimeout(() => {
      console.log("Hello after 0 seconds.."); //3
    }, 0);

    setTimeout(function () {
      console.log("Hello after 10 seconds.."); //5
    }, 10000);

    setInterval(() => {
      console.log("Hello every 4 seconds.."); //4
    }, 4000);

    console.log(x); // 1
    console.log("Hello World.."); // 2
  </script>
</html>
