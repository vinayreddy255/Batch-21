    <title>Document</title>

  <body>
    <h2 id="length"></h2>
    <h2 id="upper"></h2>
    <h2 id="lower"></h2>
    <h2 id="includes"></h2>
    <h2 id="indexOf"></h2>
    <h2 id="lastIndexOf"></h2>
  </body>
  <script>
    // length, toUpperCase, toLowerCase, includes, indexOf, lastIndexOf,
    var str = "Hello, World! React is awesome.W";
    console.log(str.length); // Output: 13
    document.getElementById("length").innerHTML =
      "Length of the string is: " + str.length;
    document.getElementById("upper").innerHTML =
      "Uppercase of the string is: " + str.toUpperCase();
    document.getElementById("lower").innerHTML =
      "Lowercase of the string is: " + str.toLowerCase();
    document.getElementById("includes").innerHTML =
      "Does the string include 'React'? " + str.includes("react");
    document.getElementById("indexOf").innerHTML =
      "Index of 'W' in the string is: " + str.indexOf("W");
