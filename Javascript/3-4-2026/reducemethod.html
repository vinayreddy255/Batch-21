<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

  <body></body>
  <script>
    // reduce() - executes a reducer function on each element of the array, resulting in a single output value.
    // it wil retrn  single value or object or array
    var arr = [1, 2, 3, 4, 5];
    var sum = arr.reduce(function (accumulator, currentValue, index, array) {
      return accumulator + currentValue;
    }, 0);
    console.log(sum);

    // filer and map with reduce
    var arrobj = [
      { name: "John", age: 30, city: "New York", pin: 12345 },
      { name: "Jane", age: 25, city: "Los Angeles", pin: 67890 },
      { name: "Jim", age: 35, city: "Chicago", pin: 54321 },
      { name: "Jack", age: 28, city: "Houston", pin: 98765 },
      { name: "Jill", age: 32, city: "Phoenix", pin: 45678 },
    ];
    var result = arrobj.reduce(function (acc, el) {
      if (el.age > 30) {
        acc.push(el);
      }
      return acc;
    }, []);
    console.log(result);
  </script>
</html>
