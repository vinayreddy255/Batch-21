  <script>
    // Array Methods
    // forEach() - executes a provided function once for each array element.
    // map() - creates a new array populated with the results of calling a provided function on
    // filter() - creates a new array with all elements that pass the test implemented by the provided function.
    // reduce() - executes a reducer function on each element of the array, resulting in a single output value.
    // find() - returns the value of the first element in the array that satisfies the provided
    var arr = ["a", "b", "c", "d", "e", "f", "g", "h", "i", "j"];
    // for (var i = 0; i < arr.length; i++) {
    //   console.log(arr[i]);
    // }
    arr.forEach(function (element, index, array) {
      console.log(element, "index:", index, "array:", array);
    });
