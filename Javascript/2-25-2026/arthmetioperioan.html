<script>
    // addion, subtration, multiplation, division
    // console.log(10+20)
    // console.log(10*20)
    // console.log(10-20)
    // console.log(10/20)
    // console.log(10%20)
    function arthmeticOperations(a,b, id){
        var result = 0;
        if(id ==='+'){
            result = a+b;
        } else if(id ==='-'){
            result = a-b;
        } else if(id ==="*"){
            result = a*b;
        } 
        return result;
        
    }
    var a = arthmeticOperations(10,20,'+')
    var s = arthmeticOperations(10,4,'')
    console.log(a) // 30
    console.log(s) // 40
</script>
