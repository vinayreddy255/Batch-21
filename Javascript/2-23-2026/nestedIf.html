<html lang="en">

  <body></body>
  <script>
    let arr = [1, 2, 3, 4, 5];
    if (arr.length < 0) {
      console.log("Array is not empty.");
      if (arr.length > 3) {
        console.log("Array has more than 3 elements.");
      } else {
        console.log("Array has 3 or fewer elements.");
      }
    } else {
      console.log("Array is empty.");
    }
  </script>
